<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0d14" />
    <title>VPB Finanças | Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0f0d14;
        color: #f8f7fb;
      }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0;
        color: #b9b5c5;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #d946ef;
        color: #0f0d14;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>As páginas visitadas ficam disponíveis quando a conexão retornar.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
